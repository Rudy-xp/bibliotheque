<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma Bibliothèque</title>
<meta name="theme-color" content="#16493f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibliothèque">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : app mobile, barre d'onglets en bas, contenu en une colonne (grille de couvertures) */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#e8ece7; --ink:#1b2422; --muted:#5d6b67; --line:#d5dcd7;
  --accent:#16493f; --accent-ink:#ffffff; --accent-soft:#d6e7e1;
  --loan:#a8701c; --loan-soft:#f4e6cc; --bad:#b3362c; --bad-soft:#f6dcd8; --ok:#2d7a4f; --ok-soft:#d8eedf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#1a2220; --surface2:#232e2b; --ink:#e7eeeb; --muted:#9aaaa5; --line:#2f3b38;
  --accent:#6cc1a9; --accent-ink:#0d1a17; --accent-soft:#1e3a33;
  --loan:#e2a94e; --loan-soft:#3a2d16; --bad:#ef7a6f; --bad-soft:#3d1f1c; --ok:#6fcf97; --ok-soft:#1b3326;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line)}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:22px;flex:1}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));max-width:980px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab-h);
  text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
nav.tabs a .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}

input[type=text],input[type=search],input[type=url],input[type=date],input[type=number],input[type=password],select,textarea{font-size:16px;
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.f > *{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}

.search{display:flex;gap:8px;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
.toolbar .count{flex:1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.toolbar select{width:auto;min-height:34px;padding:5px 8px;font-size:13px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
.book{cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left}
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:4px 8px 8px 4px;overflow:hidden;background:var(--surface2);
  box-shadow:0 1px 2px rgba(0,0,0,.15),inset 3px 0 0 rgba(0,0,0,.12)}
.cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 8px 10px 12px;color:#fff;font-family:var(--display);
  background:linear-gradient(90deg,rgba(0,0,0,.25) 0 5px,transparent 5px),var(--c,#3c5a52)}
.gen b{font-size:13px;line-height:1.15;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.gen small{font-family:var(--body);font-size:10px;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.badge{position:absolute;z-index:2;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.02em}
.badge.tome{top:6px;right:6px;background:rgba(0,0,0,.72);color:#fff}
.badge.loan{bottom:6px;left:8px;background:var(--loan);color:#fff}
.badge.read{bottom:6px;right:6px;background:var(--ok);color:#fff}
.book .t{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book .a{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li .cover{width:46px;flex:none}
.li .gen b{font-size:7px}.li .gen small{display:none}
.li .badge,.cand .badge,.series-row .badge,.tome .badge{display:none}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.li .body{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li .a{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.loan{background:var(--loan-soft);color:var(--loan)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}
.action svg{width:28px;height:28px;color:var(--accent)}
.action b{font-family:var(--display);font-size:16px}
.action span{font-size:12.5px;color:var(--muted)}
.action.main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.action.main svg,.action.main span{color:var(--accent-ink)}
.action.main span{opacity:.85}
.section{margin-top:22px}
.section > h2{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .head h2{flex:1;font-size:19px}
.form{display:flex;flex-direction:column;gap:12px}
.detail-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.detail-top .cover{width:110px;flex:none}
.detail-top .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.detail-top h3{font-size:19px;line-height:1.2}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:#d9a21b}
.loanbox{border-radius:var(--r);padding:12px;background:var(--loan-soft);display:flex;flex-direction:column;gap:8px}
.loanbox.free{background:var(--surface2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.scanner .bar b{flex:1;font-family:var(--display);font-size:18px}
.scanner .view{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;left:8%;right:8%;top:50%;height:28%;transform:translateY(-50%);border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanner .frame.hit{border-color:#6fcf97}
.scanner .feed{background:#111;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:38vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.scanner .feed .it{display:flex;gap:10px;align-items:center;font-size:13px}
.scanner .feed .it img,.scanner .feed .it .ph{width:28px;height:42px;object-fit:cover;border-radius:3px;background:#333;flex:none}
.scanner .btn{background:#222;border-color:#444;color:#fff}

.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.cand{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-width:0;text-align:left;width:100%}
.cand.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cand .cover{width:40px;flex:none}
.cand .gen b{font-size:6px}.cand .gen small{display:none}
.cand .body{min-width:0;flex:1}
.cand .t{font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cand .a{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pend{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pend .ocr{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}

.series-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.series-row .stack{display:flex;flex:none;width:70px;height:60px;position:relative}
.series-row .stack .cover{position:absolute;width:40px;top:0}
.series-row .body{flex:1;min-width:0}
.series-row .t{font-weight:600;font-family:var(--display);font-size:16px}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.tomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
.tome{display:flex;flex-direction:column;gap:5px;min-width:0}
.tome .num{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tome.missing .cover{opacity:.55;outline:2px dashed var(--bad);outline-offset:-2px}
.tome.gap .cover{display:flex;align-items:center;justify-content:center;outline:2px dashed var(--line);outline-offset:-2px;background:transparent;box-shadow:none;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.tome .t{font-size:12px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;cursor:pointer}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.summary{font-size:14px;line-height:1.55;white-space:pre-wrap}
.coverpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.coverpick button{border:2px solid transparent;padding:0;background:none;border-radius:6px;cursor:pointer}
.coverpick button:focus-visible,.coverpick button:hover{border-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <a href="#livres" data-v="livres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.5 1-4 15-3.4-1z"/></svg>Livres</a>
  <a href="#ajouter" data-v="ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Ajouter<span class="dot" id="pendDot" hidden></span></a>
  <a href="#series" data-v="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="5" height="14" rx="1"/><rect x="9.5" y="5" width="5" height="14" rx="1"/><rect x="16" y="5" width="5" height="14" rx="1" stroke-dasharray="2 2"/></svg>Séries</a>
  <a href="#prets" data-v="prets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Prêts<span class="dot" id="loanDot" hidden></span></a>
  <a href="#plus" data-v="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Plus</a>
</nav>
<div id="layer"></div>
<input type="file" id="fileBarcode" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="fileShelf" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="fileCover" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="fileImport" class="vh" accept="application/json,.json" tabindex="-1" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ============ Utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"}) : "";
const safeUrl = u => (typeof u === "string" && /^https:\/\//.test(u)) ? u : "";
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hashColor(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0;
  const hues = [158, 200, 12, 32, 260, 340, 120, 220, 45, 185]; const hue = hues[Math.abs(h) % hues.length];
  return `hsl(${hue} ${30 + Math.abs(h >> 4) % 25}% ${28 + Math.abs(h >> 8) % 14}%)`; }
const STATUS = {alire:"À lire", encours:"En cours", lu:"Lu", abandon:"Abandonné"};
const TYPES = ["BD","Manga","Comics","Roman","Policier / Thriller","SF / Fantasy","Jeunesse","Essai","Documentaire","Biographie","Poésie","Théâtre","Pratique","Beau livre","Autre"];
function guessType(m){
  const cat = norm([...(m.categories || []), ...(m.subjects || []).slice(0, 20)].join(" ")), pub = norm(m.publisher);
  if (/\b(kana|pika|ki oon|kurokawa|kaze|tonkam|akata|doki doki|delcourt tonkam|glenat manga|nobi nobi|meian)\b/.test(pub) || /\bmanga/.test(cat)) return "Manga";
  if (/\b(urban comics|panini|marvel|dc comics)\b/.test(pub) || /\b(superhero|super heros)\b/.test(cat)) return "Comics";
  if (/\b(dargaud|dupuis|casterman|delcourt|lombard|soleil|bamboo|futuropolis|fluide glacial|vents d ouest|humanoides|albert rene|rue de sevres|glenat|marsu|grand angle|blake mortimer|editions jacobs)\b/.test(pub) || /\b(comics graphic novels|bandes dessinees|bande dessinee|graphic novel|comic)/.test(cat)) return "BD";
  if (/\b(juvenile|jeunesse|children)/.test(cat)) return "Jeunesse";
  if (/\b(biograph|autobiograph|memoir)/.test(cat)) return "Biographie";
  if (/\b(poetry|poesie|poems)/.test(cat)) return "Poésie";
  if (/\b(drama|theatre)\b/.test(cat)) return "Théâtre";

const TOME_RE = /(?:\btome|\bt\.|\bt(?=\d)|\bvol(?:ume)?\.?|\bn[°o]\.?|\bno\.|#|\bépisode|\balbum)\s*(\d{1,3})\b/i;

    if (mm) return { series: mm[1].trim(), tome: +mm[2] };

    return { series: m.series.replace(/\s*[;,]\s*$/, "").trim(), tome: t ? +t[1] : "" }; }

  if ((r = full.match(/^(.+?)\s*[-–]\s*(.+?)\s*[-–(]\s*(?:n[°o]|tome|t\.?)\s*(\d{1,3})\b/i))) return { series: r[1].trim(), tome: +r[3] };

  if ((r = full.match(/^(.+?)\s*[-–]\s*(\d{1,3})\s*[-–:.]\s*\S/))) return { series: r[1].trim(), tome: +r[2] };

function coverList(b){
  if (b.coverData && /^data:image\/(jpeg|png|webp);base64,/.test(b.coverData)) return [b.coverData];
  const l = []; if (safeUrl(b.cover)) l.push(b.cover);
  const i = b.isbn && toIsbn13(b.isbn);
  if (i) { l.push(`https://covers.openlibrary.org/b/isbn/${i}-M.jpg?default=false`);
    if (i.startsWith("978")) l.push(`https://images-na.ssl-images-amazon.com/images/P/${isbn13to10(i)}.01.MZZZZZZZ.jpg`); }
  return [...new Set(l)];
}
window.coverFail = img => { let l = []; try { l = JSON.parse(img.dataset.c || "[]"); } catch(_){}
  const n = +img.dataset.i + 1; if (n < l.length) { img.dataset.i = n; img.src = l[n]; } else img.remove(); };
function photoToDataUrl(file, max = 480){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
  const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .82)); }; img.onerror = rej; img.src = URL.createObjectURL(file); }); }

/* ============ Vue : bibliothèque ============ */
function filtered(){
  const u = S.ui; const q = norm(u.q);
  let r = S.books.filter(b => {
    if (u.filter === "alire" && b.status !== "alire") return false;
    if (u.filter === "encours" && b.status !== "encours") return false;
    if (u.filter === "lu" && b.status !== "lu") return false;
    if (u.filter === "pret" && !b.loan) return false;
    if (u.filter === "serie" && !b.series) return false;
    if (u.filter === "offert" && !b.giftFrom) return false;
    if (u.list && !(b.lists || []).includes(u.list)) return false;
    if (u.type && (b.type || "") !== u.type) return false;
    if (q && !norm([b.title, b.subtitle, authorsTxt(b), b.series, b.type, b.isbn, b.publisher, b.giftFrom, b.location, (b.lists || []).join(" ")].join(" ")).includes(q)) return false;
    return true; });
  const c = (a, b) => String(a || "").localeCompare(String(b || ""), "fr", {sensitivity:"base", numeric:true});
  const sorts = {
    added: (a, b) => b.addedAt - a.addedAt,
    title: (a, b) => c(a.title, b.title),
    author: (a, b) => c(lastName(a), lastName(b)) || c(a.series, b.series) || (a.tome || 0) - (b.tome || 0),
    series: (a, b) => c(a.series || a.title, b.series || b.title) || (a.tome || 0) - (b.tome || 0),
    acquired: (a, b) => c(b.acquiredAt, a.acquiredAt),
    read: (a, b) => c(b.readAt, a.readAt),
    year: (a, b) => c(b.year, a.year),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0),
    type: (a, b) => c(a.type || "~", b.type || "~") || c(a.series || a.title, b.series || b.title) || (a.tome || 0) - (b.tome || 0),
  };
  return r.sort(sorts[u.sort] || sorts.added);
}
const lastName = b => { const a = (b.authors || [])[0] || ""; return a.includes(",") ? a : a.split(" ").slice(-1)[0]; };
function allLists(){ const s = new Set(); S.books.forEach(b => (b.lists || []).forEach(l => s.add(l))); return [...s].sort((a, b) => a.localeCompare(b, "fr")); }

/* ---- Lecteur de codes-barres (BarcodeDetector natif, sinon ZXing en WebAssembly) ---- */
let BDClass = null;
async function getDetector(){
  if (!BDClass) {
    if ("BarcodeDetector" in window) { try { const f = await window.BarcodeDetector.getSupportedFormats(); if (f.includes("ean_13")) BDClass = window.BarcodeDetector; } catch(_){} }
    if (!BDClass) { const m = await import("https://cdn.jsdelivr.net/npm/barcode-detector@2.2.11/+esm"); BDClass = m.BarcodeDetector; }
  }
  return new BDClass({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
}
async function decodeImageFile(f){
  const det = await getDetector();

  const W = src.width, H = src.height, c = document.createElement("canvas"), x = c.getContext("2d");
  for (const max of [1800, 2800, 1100]) {
    const k = Math.min(1, max / Math.max(W, H)); c.width = Math.round(W * k); c.height = Math.round(H * k); x.drawImage(src, 0, 0, c.width, c.height);
    try { const r = await det.detect(c); const hit = r.find(z => toIsbn13(z.rawValue)) || r[0]; if (hit) return hit.rawValue; } catch(_){}
  }
  return null;
}
let scanning = null;
async function openScanner(){

  document.body.appendChild(box);

  const recent = new Map(); let stream = null, running = true;

  $("#scanClose", box).onclick = close;

  } catch (err) {

    return;
  }

    else row.innerHTML = `<span class="ph"></span><span>${esc(isbn)} · introuvable dans les catalogues, à saisir plus tard</span>`;
  };
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });

      cv.width = Math.round(vw * k); cv.height = Math.round(vh * k); cx.drawImage(video, 0, 0, cv.width, cv.height);

    }

  };

}

/* ---- Ajout depuis un lien ---- */
function isbnFromUrl(u){
  const m = u.match(/\/(?:dp|gp\/product|ASIN|product)\/([0-9]{9}[0-9X])(?:[\/?#]|$)/i); if (m) { const i = toIsbn13(m[1]); if (i) return i; }
  const m2 = u.replace(/[-]/g, "").match(/(97[89]\d{10})/); if (m2 && validEan13(m2[1])) return m2[1];
  return null;
}
function titleFromUrl(u){ try { const x = new URL(u); const seg = decodeURIComponent(x.pathname).split("/").filter(Boolean); const wi = seg.indexOf("wiki");
  const s = wi >= 0 ? seg[wi + 1] : (seg.find(p => /[a-zà-ÿ]{3,}[-_][a-zà-ÿ]{3,}/i.test(p)) || "");
  return s.replace(/\.html?$/, "").replace(/[_-]+/g, " ").replace(/\b\d{6,}\b/g, "").trim(); } catch(_) { return ""; } }
async function importFromUrl(url){
  let page = {};
  if (URL_IMPORT_READY) { try { const r = await callFn("import-url", { url }); if (r.ok) page = r.data || {}; } catch(_){} }
  if (page.blocked || page.status >= 400) page = { site: page.site };
  if (/amazon\.|: Livres$/i.test(page.description || "") && (page.description || "").length < 200) page.description = "";
  if (typeof page.title === "string" && /^[^a-zà-ÿ]*$/.test(page.title.split(":")[0])) { const t = page.title.split(" : ")[0]; page.title = t.charAt(0) + t.slice(1).toLowerCase(); }
  if (!page.title && /wikipedia\.org\/wiki\//.test(url)) { try { const x = new URL(url); const lang = x.hostname.split(".")[0];
    const p = await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${x.pathname.slice(6)}`);
    page = { title: p.title, description: p.extract, cover: (p.originalimage || p.thumbnail || {}).source || "", site: "wikipedia.org" }; } catch(_){} }
  const isbn = toIsbn13(page.isbn || "") || isbnFromUrl(url);
  let cat = null; if (isbn) { try { cat = await lookupIsbn(isbn); } catch(_){} }
  if (!cat) { const t = page.title || titleFromUrl(url);
    if (t) { const r = await searchText([t, (page.authors || [])[0]].filter(Boolean).join(" "), 4).catch(() => []);
      const tn = norm(t); cat = r.find(m => { const mn = norm(m.title); return mn && (tn.startsWith(mn) || mn.startsWith(tn)); }) || (page.title ? null : r[0]) || null; } }
  if (!cat && !page.title) return null;
  const pg = { title: page.title, authors: page.authors || [], publisher: page.publisher, year: page.year, pages: page.pages, description: page.description, cover: safeUrl(page.cover), isbn: isbn || "" };
  const m = merge(cat, pg);
  if (pg.cover) m.cover = pg.cover;
  if (!m.description && pg.description) m.description = pg.description;
  m.source = [cat && cat.source, page.site].filter(Boolean).join(" + ") || "Lien";
  return m;
}

/* ---- OCR étagère (Tesseract.js, sur l'appareil) ---- */
let tessLoading = null;
function loadTesseract(){ if (window.Tesseract) return Promise.resolve();
  return tessLoading ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = res; s.onerror = () => { tessLoading = null; rej(new Error("load")); }; document.head.appendChild(s); }); }
function imageToCanvas(file, maxSide = 2000){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
  const k = Math.min(1, maxSide / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const ctx = c.getContext("2d"); ctx.filter = "grayscale(1) contrast(1.35)"; ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c); }; img.onerror = rej; img.src = URL.createObjectURL(file); }); }
function rotate(c, deg){ const r = document.createElement("canvas"); const sw = deg % 180 !== 0; r.width = sw ? c.height : c.width; r.height = sw ? c.width : c.height;
  const x = r.getContext("2d"); x.translate(r.width / 2, r.height / 2); x.rotate(deg * Math.PI / 180); x.drawImage(c, -c.width / 2, -c.height / 2); return r; }
const STOP = new Set(["editions","edition","folio","poche","pocket","gallimard","hachette","dargaud","dupuis","casterman","glenat","delcourt","lombard","soleil","flammarion","seuil","livre","points","j ai lu","le livre de poche","10 18","babel","albin michel","actes sud","robert laffont","grasset"]);

function goodCandidate(s){ const n = norm(s); if (n.length < 5) return false; if (STOP.has(n)) return false;
  const letters = (s.match(/[a-zà-ÿ]/gi) || []).length; if (letters < 4 || letters / s.length < .6) return false;
  const words = n.split(" ").filter(w => w.length > 1); return words.length >= 1 && words.some(w => w.length >= 4); }
$("#fileShelf").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  location.hash = "#ajouter"; await sleep(50);
  const box = $("#ocrBox"); if (!box) return;
  box.innerHTML = `<div class="section card"><b>Lecture des tranches…</b><div class="small muted" id="ocrMsg">Chargement du moteur OCR (première fois : ~10 Mo)</div><div class="progress" style="margin-top:8px"><i id="ocrBar"></i></div></div>`;
  const bar = $("#ocrBar"), msg = $("#ocrMsg");
  try {
    await loadTesseract();
    const worker = await Tesseract.createWorker("fra+eng", 1, { logger: m => { if (m.status === "recognizing text" && bar) bar.style.width = Math.round(m.progress * 100) + "%"; } });
    await worker.setParameters({ tessedit_pageseg_mode: "11" });
    const base = await imageToCanvas(f);
    // Les tranches sont verticales : on lit l'image tournée dans les deux sens, plus l'original
    const passes = [["tranches (sens 1)", rotate(base, 90)], ["tranches (sens 2)", rotate(base, -90)], ["image droite", base]];
    const lines = [];
    for (const [label, cv] of passes) { msg.textContent = "Lecture : " + label; bar.style.width = "0";
      const { data } = await worker.recognize(cv);
      (data.lines || []).forEach(l => { if (l.confidence > 45) lines.push({ text: cleanOcrLine(l.text), conf: l.confidence }); }); }
    await worker.terminate();
    const seen = new Set(); const cands = lines.filter(l => goodCandidate(l.text)).filter(l => { const k = norm(l.text); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => b.conf - a.conf).slice(0, 25);
    if (!cands.length) { box.innerHTML = `<div class="section card"><b>Aucun texte lisible.</b><div class="small muted">Essaie avec moins de livres par photo (5 à 10), bien de face et éclairés.</div></div>`; return; }
    msg.textContent = `${cands.length} textes trouvés, recherche des livres…`;
    let done = 0;
    for (const c of cands) {
      let items = []; try { items = await searchText(c.text, 3); } catch(_){}
      items = items.filter(m => !(m.isbn && S.books.find(b => b.isbn === m.isbn))).slice(0, 4);
      if (items.length) { const p = { id: uid(), text: c.text, conf: Math.round(c.conf), cands: items, at: Date.now() }; S.pending.push(p); await DB.put("pending", p); }
      bar.style.width = Math.round(++done / cands.length * 100) + "%"; await sleep(150);
    }
    box.innerHTML = `<div class="section card"><b>Terminé.</b> <span class="small muted">Valide ci-dessous les livres reconnus.</span></div>`;
    renderPending(); updateDots();
  } catch (err) { box.innerHTML = `<div class="section card"><b>L'OCR n'a pas pu démarrer.</b><div class="small muted">Vérifie la connexion (le moteur se télécharge la première fois), puis réessaie.</div></div>`; }

/* ============ Séries ============ */
function seriesGroups(){
  const g = {};
  S.books.filter(b => b.series).forEach(b => { const k = seriesKey(b.series); (g[k] ||= { key: k, name: b.series, books: [] }).books.push(b); });
  Object.values(S.series).forEach(s => { if (!g[s.key]) g[s.key] = { key: s.key, name: s.name, books: [] }; });
  return Object.values(g).map(x => { const meta = S.series[x.key] || {}; const owned = new Set(x.books.map(b => +b.tome).filter(Boolean));
    const total = meta.total || Math.max(0, ...owned, ...(meta.found || []).map(f => f.tome));
    const missing = total ? [...Array(total)].map((_, i) => i + 1).filter(n => !owned.has(n) && !(meta.notOwnedOk || []).includes(n)).length : 0;
    return { ...x, name: meta.name || x.name, total, ownedCount: owned.size, missing }; })
    .sort((a, b) => b.missing - a.missing || a.name.localeCompare(b.name, "fr"));

async function findSeriesTomes(name, books){
  const author = ((books[0] || {}).authors || [])[0] || "";
  const found = [];
  const add = (m, src) => { const ds = detectSeries(m); let n = (ds.series && seriesKey(ds.series).includes(seriesKey(name).slice(0, 12))) ? ds.tome : null;
    if (!n) n = tomeIn([m.series, m.title, m.subtitle].filter(Boolean).join(" - "), name);
    if (n) found.push({ tome: +n, title: m.title + (m.subtitle ? " - " + m.subtitle : ""), authors: m.authors || [], cover: safeUrl(m.cover), isbn: m.isbn || "", year: m.year || "", src }); };
  const qs = [`intitle:"${name}"`, `"${name}" tome`];
  if (author) qs.push(`intitle:"${name}" inauthor:"${author.split(" ").slice(-1)[0]}"`);
  for (const q of qs) for (const start of [0, 40]) {
    try { const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=40&startIndex=${start}&printType=books${gbKey()}`);
      (j.items || []).forEach(it => add(gbMap(it), "Google Books")); if (!j.items || j.items.length < 40) break; } catch(_) { break; } }
  try { const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(name)}&limit=200&fields=title,subtitle,author_name,cover_i,isbn,first_publish_year,series`, 15000);
    (j.docs || []).forEach(d => add({ title: d.title, subtitle: d.subtitle, authors: d.author_name, cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "",
      isbn: (d.isbn || []).find(x => x.length === 13 && x.startsWith("978")) || "", year: d.first_publish_year, series: (d.series || [])[0] || "" }, "Open Library")); } catch(_){}
  // un résultat par tome : priorité à celui qui a une couverture
  const best = {}; found.forEach(f => { const cur = best[f.tome]; if (!cur || (!cur.cover && f.cover) || (!cur.isbn && f.isbn && !!f.cover === !!cur.cover)) best[f.tome] = f; });
  return Object.values(best).sort((a, b) => a.tome - b.tome);
}

/* ============ Toast ============ */
let toastT;
function toast(msg, act, fn){ $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button>${esc(act)}</button>` : ""}`; if (act) t.querySelector("button").onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3500); }

/* ============ Démarrage ============ */
(async () => {
  try { await DB.open(); await loadAll(); } catch (e) { $("#main").innerHTML = `<div class="empty"><h2>Stockage indisponible</h2><p>Ouvre l'app dans un navigateur normal (pas en navigation privée).</p></div>`; return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
  initSync();
  const qs = new URLSearchParams(location.search), shared = qs.get("url") || ((qs.get("text") || "").match(/https?:\/\/\S+/) || [])[0];
  if (shared) { history.replaceState(null, "", location.pathname + "#ajouter"); setTimeout(() => openUrlImport(shared), 300); }
  window.addEventListener("hashchange", route); route();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
